services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the hardened deployment}
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

  api:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://repovista:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the hardened deployment}@postgres:5432/repovista
      WEB_ORIGIN: ${WEB_ORIGIN:?Set HTTPS WEB_ORIGIN for the hardened deployment}
      API_ORIGIN: ${API_ORIGIN:?Set HTTPS API_ORIGIN for the hardened deployment}
      AUTH_COOKIE_SECURE: "true"
      DEMO_SEED_ENABLED: "false"
      RUN_MIGRATIONS_ON_START: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  demo-seed:
    profiles: ["demo"]
    environment:
      DEMO_SEED_ENABLED: "false"

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://repovista:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the hardened deployment}@postgres:5432/repovista
      WEB_ORIGIN: ${WEB_ORIGIN:?Set HTTPS WEB_ORIGIN for the hardened deployment}
      API_ORIGIN: ${API_ORIGIN:?Set HTTPS API_ORIGIN for the hardened deployment}
      AUTH_COOKIE_SECURE: "true"
      DEMO_SEED_ENABLED: "false"
    depends_on: !override
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  web:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
